[project]
name = "server"
version = "0.1.0"
description = "FastAPI: fuente de verdad (SQLite), API, SSE, dispatcher y worker CPU. Sin torch."
requires-python = ">=3.12,<3.13"
dependencies = [
    "engine-contract",
]

[tool.uv.sources]
engine-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

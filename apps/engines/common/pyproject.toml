[project]
name = "engine-common"
version = "0.1.0"
description = "Servidor /v1 común, supervisor de proceso hijo, VramGuard y verificación de pesos."
requires-python = ">=3.11"
dependencies = [
    "engine-contract",
]

[tool.uv.sources]
engine-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_common"]

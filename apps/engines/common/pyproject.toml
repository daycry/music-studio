[project]
name = "engine-common"
version = "0.1.0"
description = "Servidor /v1 común, supervisor de proceso hijo, VramGuard y verificación de pesos."
requires-python = ">=3.11"
dependencies = [
    "engine-contract",
    "fastapi>=0.142.2",
    "jsonschema>=4.26.0",
    "nvidia-ml-py>=13.615.71",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
engine-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_common"]

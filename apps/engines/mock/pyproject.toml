[project]
name = "engine-mock"
version = "0.1.0"
description = "Engine /v1 con salida sintética, sin GPU, para desarrollo del server."
requires-python = ">=3.11"
dependencies = [
    "engine-common",
    "engine-contract",
]

[tool.uv.sources]
engine-common = { workspace = true }
engine-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_mock"]

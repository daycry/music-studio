[project]
name = "engine-contract"
version = "0.1.0"
description = "Modelos Pydantic del contrato /v1 entre el server y los engines (sin torch)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_contract"]
